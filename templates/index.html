<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; text-align: center; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Churn Risk Analyzer</h2>
        <form action="/predict" method="post">
            <input type="number" name="tenure" placeholder="Tenure (Months)" required>
            <input type="number" name="charges" placeholder="Monthly Charges ($)" required>
            <input type="number" name="interactions" placeholder="Total App Interactions" required>
            <input type="number" name="tickets" placeholder="Support Tickets Raised" required>
            <button type="submit">Predict Risk Score</button>
        </form>
        
        {% if result %}
        <div class="result">
            <h3>{{ result }}</h3>
            <p>Churn Probability: {{ prob }}%</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
